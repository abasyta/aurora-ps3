# Builds aurora.pkg on GitHub's cloud (runs when manually dispatched).
# Toolchain is cached, so only the first run is slow (1-3h).
name: Build Aurora PKG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PS3 toolchain
        uses: actions/cache@v4
        with:
          path: ~/ps3dev
          key: ps3dev-${{ runner.os }}

      - name: Install build dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install build-essential autoconf automake bison flex \
            libelf-dev make texinfo libncurses-dev patch wget zlib1g-dev \
            libtool libtool-bin bzip2 libgmp-dev pkg-config libssl-dev \
            git python3 python-is-python3 fonts-dejavu-core

      - name: Toolchain (first run only, 1-3h)
        run: |
          export PS3DEV=$HOME/ps3dev
          export PSL1GHT=$PS3DEV
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin
          if [ ! -x "$PS3DEV/ppu/bin/ppu-gcc" ]; then
            git clone --depth 1 https://github.com/ps3dev/ps3toolchain $HOME/ps3toolchain
            cd $HOME/ps3toolchain && ./toolchain.sh
          else
            echo "toolchain restored from cache"
          fi

      - name: Port libraries (cairo + freetype + pixman)
        run: |
          export PS3DEV=$HOME/ps3dev
          export PSL1GHT=$PS3DEV
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin
          if [ ! -f "$PS3DEV/portlibs/ppu/lib/libcairo.a" ]; then
            git clone --depth 1 https://github.com/ps3dev/ps3libraries $HOME/ps3libraries
            cd $HOME/ps3libraries && ./libraries.sh
          else
            echo "ps3libraries restored from cache"
          fi

      - name: Assets (font + icon)
        run: |
          mkdir -p usrdir/USRDIR data
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf usrdir/USRDIR/font.ttf
          python3 scripts/gen_icon.py

      - name: Build package
        run: |
          export PS3DEV=$HOME/ps3dev
          export PSL1GHT=$PS3DEV
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin
          make pkg
          ls -lh aurora.pkg

      - name: Upload aurora.pkg
        uses: actions/upload-artifact@v4
        with:
          name: aurora-pkg
          path: aurora.pkg
