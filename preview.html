<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Aurora Coverflow PS3 — معاينة التصميم</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Segoe UI",Tahoma,sans-serif; background:#05050f; color:#fff; overflow:hidden; }
  .screen { position:relative; width:100vw; height:100vh;
    background:linear-gradient(180deg,#21175c 0%,#2b1f66 42%,#0f1130 75%,#050510 100%); }
  /* أشرطة الشفق */
  .ribbon { position:absolute; width:140%; height:26%; left:-20%; border-radius:50%;
    filter:blur(28px); opacity:.35; }
  .r1 { top:30%; background:radial-gradient(ellipse,#19f0dd 0%,transparent 65%); transform:rotate(-6deg); }
  .r2 { top:38%; background:radial-gradient(ellipse,#8a5cff 0%,transparent 65%); transform:rotate(4deg); }
  .r3 { top:26%; background:radial-gradient(ellipse,#ff59c8 0%,transparent 60%); transform:rotate(-2deg); opacity:.22; }
  .glow { position:absolute; width:40%; height:55%; border-radius:50%; filter:blur(70px); opacity:.30; }
  .g1 { left:2%; bottom:-8%; background:#7d32a8; }
  .g2 { right:-6%; top:-10%; background:#2347c8; }

  .top { position:absolute; top:18px; left:0; right:0; display:flex; justify-content:space-between; padding:0 28px;
    font-size:15px; letter-spacing:3px; color:#ffffffd8; }
  .brand { letter-spacing:6px; font-weight:600; }

  /* coverflow */
  .stage { position:absolute; top:10%; bottom:22%; left:0; right:0; perspective:1100px; display:flex;
    align-items:flex-end; justify-content:center; gap:0; }
  .cover { position:absolute; bottom:0; width:200px; height:300px; border-radius:10px; overflow:hidden;
    box-shadow:0 18px 40px rgba(0,0,0,.55); background:#1a1440; transition:all .45s ease; }
  .cover img,.cover .art { width:100%; height:100%; object-fit:cover; display:block; }
  .cover .art { display:flex; align-items:center; justify-content:center; font-weight:700; font-size:20px; color:#ffffffcc; }
  .cover.center { transform:translateX(0) scale(1.25); z-index:10; box-shadow:0 0 0 3px #fff, 0 0 46px 10px rgba(255,255,255,.28), 0 18px 40px rgba(0,0,0,.6); }
  .cover.s1  { transform:translateX(-160px) scale(.82) rotateY(8deg); z-index:8; filter:brightness(.85); }
  .cover.s1r { transform:translateX(160px)  scale(.82) rotateY(-8deg); z-index:8; filter:brightness(.85); }
  .cover.s2  { transform:translateX(-285px) scale(.68) rotateY(12deg); z-index:7; filter:brightness(.72); }
  .cover.s2r { transform:translateX(285px)  scale(.68) rotateY(-12deg); z-index:7; filter:brightness(.72); }
  .cover.s3  { transform:translateX(-380px) scale(.58) rotateY(14deg); z-index:6; filter:brightness(.62); }
  .cover.s3r { transform:translateX(380px)  scale(.58) rotateY(-14deg); z-index:6; filter:brightness(.62); }
  .reflection { position:absolute; top:100%; left:0; right:0; height:60px; transform:scaleY(-1); opacity:.16;
    background:inherit; filter:blur(1px); }

  .titlebar { position:absolute; bottom:11.5%; left:0; right:0; text-align:center; padding:10px 0 12px;
    background:linear-gradient(180deg,rgba(0,0,0,.66),rgba(0,0,0,.52)); }
  .titlebar .name { font-size:26px; font-weight:600; }
  .titlebar .count { font-size:13px; color:#c9c9d4; margin-top:3px; }

  .hints { position:absolute; bottom:0; left:0; right:0; height:9%; background:#f4f5fa;
    display:flex; align-items:center; justify-content:center; gap:34px; color:#22232b; }
  .hint { display:flex; align-items:center; gap:8px; font-size:14px; }
  .key { width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:13px; font-weight:700; }
  .kx{background:#3a8df5}.ko{background:#ee4444}.ks{background:#e75bb1}.kt{background:#3ec47c}
  .pill { background:#3a3d46; color:#fff; border-radius:12px; padding:3px 12px; font-size:12px; font-weight:700; }

  .note { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,.55);
    padding:10px 22px; border-radius:8px; font-size:13px; color:#fff; backdrop-filter:blur(4px); }
</style>
</head>
<body>
<div class="screen">
  <div class="ribbon r1"></div><div class="ribbon r2"></div><div class="ribbon r3"></div>
  <div class="glow g1"></div><div class="glow g2"></div>

  <div class="top"><span class="brand">AURORA</span><span>PlayStation 3</span></div>

  <div class="stage">
    <div class="cover s3"><div class="art" style="background:linear-gradient(160deg,#1b3a2f,#0c2018)">GR</div><div class="reflection"></div></div>
    <div class="cover s2"><div class="art" style="background:linear-gradient(160deg,#4a1b3a,#200c18)">BR</div><div class="reflection"></div></div>
    <div class="cover s1"><div class="art" style="background:linear-gradient(160deg,#274060,#101b2c)">BF</div><div class="reflection"></div></div>
    <div class="cover center"><div class="art" style="background:linear-gradient(160deg,#b0265c,#5e1038)">BulletWitch</div><div class="reflection"></div></div>
    <div class="cover s1r"><div class="art" style="background:linear-gradient(160deg,#8a2318,#3c0e0a)">RA3</div><div class="reflection"></div></div>
    <div class="cover s2r"><div class="art" style="background:linear-gradient(160deg,#2c4a1b,#13200c)">F12</div><div class="reflection"></div></div>
    <div class="cover s3r"><div class="art" style="background:linear-gradient(160deg,#3a2a1b,#1c140c)">MC</div><div class="reflection"></div></div>
  </div>

  <div class="titlebar">
    <div class="name">BulletWitch</div>
    <div class="count">58 of 423</div>
  </div>

  <div class="hints">
    <div class="hint"><span class="key kx">X</span> Launch</div>
    <div class="hint"><span class="key ko">O</span> About</div>
    <div class="hint"><span class="key ks">S</span> Details</div>
    <div class="hint"><span class="key kt">T</span> Refresh</div>
    <div class="hint"><span class="pill">START</span> Exit</div>
  </div>

  <div class="note">🔍 هذه معاينة ويب للتصميم — البرنامج الحقيقي (aurora.pkg) يُبنى عبر WSL</div>
</div>
</body>
</html>
